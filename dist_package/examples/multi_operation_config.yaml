# Multi-Operation Configuration File
# This file defines multiple API operations to be included in a single OpenAPI specification

# API-level metadata (optional, can also be provided via CLI)
title: "Pet Store API"
version: "1.0.0"
description: "A comprehensive Pet Store API with multiple operations"

# Operations array - each operation defines an API endpoint
operations:
  # GET operation - Find pets by status
  - method: GET
    path: /pet/findByStatus
    operation_id: findPetsByStatus
    response_json: examples/get_response.json
    summary: "Finds Pets by status"
    description: "Multiple status values can be provided with comma separated strings"
    tags:
      - pet
    # Headers are included by default. Set include_default_headers: false to disable
    # include_default_headers: true

  # GET operation - Get pet by ID
  - method: GET
    path: /pet/{petId}
    operation_id: getPetById
    response_json: examples/get_response.json
    summary: "Find pet by ID"
    description: "Returns a single pet"
    tags:
      - pet

  # POST operation - Add a new pet
  - method: POST
    path: /pet
    operation_id: addPet
    request_json: examples/post_request.json
    response_json: examples/post_response.json
    summary: "Add a new pet to the store"
    description: "Add a new pet to the store"
    tags:
      - pet

  # PUT operation - Update an existing pet
  - method: PUT
    path: /pet
    operation_id: updatePet
    request_json: examples/put_request.json
    response_json: examples/put_response.json
    summary: "Update an existing pet"
    description: "Update an existing pet by Id"
    tags:
      - pet

  # DELETE operation - Delete a pet
  - method: DELETE
    path: /pet/{petId}
    operation_id: deletePet
    request_json: examples/post_request.json
    response_json: examples/post_response.json
    summary: "Deletes a pet"
    description: "Delete a pet"
    tags:
      - pet

