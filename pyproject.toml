[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-generator-tool"
version = "1.0.0"
description = "Generate OpenAPI specifications from JSON request/response files"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["openapi", "swagger", "api", "specification", "json", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "pyyaml>=6.0",
    "click>=8.0.0",
    "streamlit>=1.28.0",
]

[project.scripts]
openapi-gen = "openapi_generator.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/openapi-generator"
Documentation = "https://github.com/yourusername/openapi-generator#readme"
Repository = "https://github.com/yourusername/openapi-generator"

